name: Validate and normalize TDK Manager

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Normalize service-call source
        run: node scripts/normalize-service-call-flow.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare build scripts
        run: chmod +x scripts/*.sh

      - name: Generate Drizzle migration
        run: npm run db:generate

      - name: Build TDK Manager
        run: npm run build

      - name: Persist normalized flow and schema
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source, schema and migrations already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app db drizzle
          git commit -m "refactor: consolida fluxo de chamados e pendencias"
          git push origin HEAD:main
